<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PetCare+ | Entrar</title>
    <link rel="icon" type="image/png" href="img/icone-pata.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="pagina-login">
<main class="auth-wrapper">
    <div class="auth-card">
        <!-- Lado Esquerdo: Foto Imersiva + Conceito -->
        <aside class="auth-media">
            <img src="img/banner-pet.jpg" alt="Cachorro e gato descansando em ambiente acolhedor">
            <div class="auth-media-overlay">
                <span class="auth-badge">CUIDAR TAMBÉM É CONHECER.</span>
                <h2>O histórico completo do seu melhor amigo em um só lugar.</h2>
                <p>Acompanhe vacinas, consultas e lembretes com carinho e organização.</p>
            </div>
        </aside>

        <!-- Lado Direito: Logo + Abas de Acesso -->
        <section class="auth-form-area">
            <div class="auth-header">
                <img class="auth-logo" src="img/logo-completa.png" alt="Logo PetCare+">
                <p class="auth-boas-vindas">Que bom ter você por aqui!</p>
            </div>

            <!-- Seletor de Abas -->
            <div class="auth-tabs" role="tablist">
                <button type="button" class="auth-tab ativo" id="tab-entrar" onclick="alternarAba('entrar')">Entrar na conta</button>
                <button type="button" class="auth-tab" id="tab-cadastrar" onclick="alternarAba('cadastrar')">Criar nova conta</button>
            </div>

            <!-- Formulário 1: Entrar -->
            <form id="form-login" class="auth-form ativo">
                <label for="l-email">E-mail</label>
                <div class="input-icon-group">
                    <input id="l-email" type="email" placeholder="seuemail@exemplo.com" required autocomplete="email">
                </div>

                <label for="l-senha">Senha</label>
                <div class="input-icon-group">
                    <input id="l-senha" type="password" placeholder="••••••••" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn-principal">Entrar no PetCare+</button>
                <p id="msg-login" role="status"></p>
            </form>

            <!-- Formulário 2: Criar Conta -->
            <form id="form-cadastro" class="auth-form">
                <label for="r-nome">Nome completo</label>
                <input id="r-nome" placeholder="Como deseja ser chamado" required maxlength="120" autocomplete="name">

                <label for="r-email">E-mail</label>
                <input id="r-email" type="email" placeholder="seuemail@exemplo.com" required maxlength="180" autocomplete="email">

                <label for="r-senha">Senha (mínimo 8 caracteres)</label>
                <input id="r-senha" type="password" placeholder="Crie uma senha segura" required minlength="8" maxlength="72" autocomplete="new-password">

                <button type="submit" class="btn-principal">Vamos conhecer seu animal?</button>
                <p id="msg-cadastro" role="status"></p>
            </form>
        </section>
    </div>
</main>

<script>
    function alternarAba(aba) {
        const isEntrar = aba === 'entrar';
        document.getElementById('tab-entrar').classList.toggle('ativo', isEntrar);
        document.getElementById('tab-cadastrar').classList.toggle('ativo', !isEntrar);
        document.getElementById('form-login').classList.toggle('ativo', isEntrar);
        document.getElementById('form-cadastro').classList.toggle('ativo', !isEntrar);
    }
</script>
<script src="js/auth.js"></script>
<script src="js/login.js"></script>
</body>
</html>
