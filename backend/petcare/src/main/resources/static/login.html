<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PetCare+ | Entrar</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topo">
    <h1>🐾 PetCare+</h1>
    <p>Histórico inteligente dos seus animais</p>
</header>

<main class="container container-login">
    <section class="painel">
        <h2>Entrar</h2>
        <form id="form-login">
            <label for="l-email">E-mail</label>
            <input id="l-email" type="email" required autocomplete="email">

            <label for="l-senha">Senha</label>
            <input id="l-senha" type="password" required autocomplete="current-password">

            <button type="submit">Entrar</button>
            <p id="msg-login" role="status"></p>
        </form>
    </section>

    <section class="painel">
        <h2>Criar conta</h2>
        <form id="form-cadastro">
            <label for="r-nome">Nome</label>
            <input id="r-nome" required maxlength="120" autocomplete="name">

            <label for="r-email">E-mail</label>
            <input id="r-email" type="email" required maxlength="180" autocomplete="email">

            <label for="r-senha">Senha (mínimo 8 caracteres)</label>
            <input id="r-senha" type="password" required minlength="8" maxlength="72"
                   autocomplete="new-password">

            <button type="submit">Criar conta</button>
            <p id="msg-cadastro" role="status"></p>
        </form>
    </section>
</main>

<script src="js/auth.js"></script>
<script src="js/login.js"></script>
</body>
</html>
