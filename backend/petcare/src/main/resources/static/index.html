<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PetCare+ | Meus Animais</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topo">
    <div class="topo-inner">
        <a class="marca" href="index.html">
            <img class="marca-logo-completa" src="img/logo-completa.png" alt="PetCare+">
            <span class="marca-divisor" aria-hidden="true"></span>
            <p class="marca-subtitulo">Todas as informações reunidas em um só lugar.</p>
        </a>

        <p class="usuario-logado">
            <span id="nome-usuario"></span>
            <button type="button" id="btn-sair">Sair</button>
        </p>
    </div>
</header>

<main class="container">
    <section class="painel">
        <h2>Cadastrar novo pet</h2>
        <p class="descricao-secao">Vamos conhecer seu animal?</p>
        <form id="form-animal">
            <label for="nome">Nome do pet</label>
            <input id="nome" placeholder="Ex.: Thor, Luna..." required maxlength="100">

            <div class="form-grid-2">
                <div>
                    <label for="especie">Espécie</label>
                    <input id="especie" placeholder="Cachorro, Gato..." required maxlength="80">
                </div>
                <div>
                    <label for="raca">Raça</label>
                    <input id="raca" placeholder="Opcional" maxlength="100">
                </div>
            </div>

            <div class="form-grid-2">
                <div>
                    <label for="nascimento">Nascimento</label>
                    <input id="nascimento" type="date">
                </div>
                <div>
                    <label for="sexo">Sexo</label>
                    <select id="sexo">
                        <option value="">Não informado</option>
                        <option value="Macho">Macho</option>
                        <option value="Fêmea">Fêmea</option>
                    </select>
                </div>
            </div>

            <label for="observacoes">Observações importantes</label>
            <textarea id="observacoes" rows="3" placeholder="Alergias, temperamento, medicações contínuas..." maxlength="2000"></textarea>

            <button type="submit">+ Cadastrar animal</button>
            <p id="mensagem" role="status"></p>
        </form>
    </section>

    <section>
        <h2>Meus animais</h2>
        <p class="descricao-secao">Acompanhe os cuidados de seu animal em um só lugar.</p>
        <div id="lista" class="grade"></div>
    </section>
</main>

<script src="js/auth.js"></script>
<script src="js/app.js"></script>
</body>
</html>
